name: Pipeline Contract Check

on:
  push:
    branches: [main, task-006-x-02-fix, task-006-x-04-base-agent-error-contract]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest python-dotenv google-genai

      - name: Run full test suite
        run: python -m pytest -q
